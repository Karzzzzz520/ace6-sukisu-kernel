name: Build Ace6 SukiSU+SusFS Kernel

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build Ace6 Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk /usr/lib/jvm /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git curl ca-certificates build-essential bc bison flex cpio libncurses-dev libelf-dev libssl-dev zlib1g-dev liblz4-tool libxml2-utils rsync unzip dwarves file python3 jq dos2unix kmod libdw-dev elfutils pigz
          df -h

      - name: Install Repo Tool
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod +x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          repo --version

      - name: Init Repo and Sync
        run: |
          mkdir -p kernel_workspace
          cd kernel_workspace
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          repo init -u https://github.com/OnePlusOSS/kernel_manifest -b oneplus/sm8750 -m oneplus_ace_6.xml --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync
          echo "=== synced tree ==="
          ls -la
          ls -la kernel_platform/ | head -30

      - name: Add SukiSU Ultra with SusFS
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          echo "=== after setup ==="
          ls -la KernelSU/ 2>/dev/null | head
          # patched: accept any signature for the manager package
          bash scripts/patch-manager.sh

      - name: Build Kernel
        run: |
          cd kernel_workspace/kernel_platform
          ls -la oplus/build/ 2>/dev/null | head
          chmod +x oplus/build/oplus_build_kernel.sh 2>/dev/null || true
          ./oplus/build/oplus_build_kernel.sh sun perf 2>&1 | tail -80

      - name: Locate Image
        id: find_image
        run: |
          cd kernel_workspace/kernel_platform
          echo "=== searching for Image ==="
          find . -name "Image" -type f 2>/dev/null | head -20
          IMG=$(find . -name "Image" -type f 2>/dev/null | grep -v "\.o$" | head -1)
          echo "Selected: $IMG"
          echo "image_path=$IMG" >> $GITHUB_OUTPUT
          if [ -n "$IMG" ]; then ls -la "$IMG"; file "$IMG"; fi

      - name: Package AnyKernel3
        if: steps.find_image.outputs.image_path != ''
        run: |
          cd kernel_workspace
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp "${{ steps.find_image.outputs.image_path }}" ak3/Image
          cd ak3
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' anykernel.sh
          echo "=== anykernel.sh head ==="
          head -30 anykernel.sh
          zip -r9 ../ace6-sukisu-susfs.zip . -x '*.git*'
          ls -la ../ace6-sukisu-susfs.zip

      - name: Upload Artifact
        if: steps.find_image.outputs.image_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ace6-sukisu-susfs-kernel
          path: kernel_workspace/ace6-sukisu-susfs.zip
          retention-days: 30
